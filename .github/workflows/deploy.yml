name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 배포는 취소하지 않고 순차 대기(연속 병합 시 진행 중 배포를 취소하면 다음 배포가 실패할 수 있음).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 서비스 오프라인 전환: 앱 번들(Supabase 접속 설정 포함)을 배포하지 않고
      # 정적 안내 페이지(offline/)만 게시한다. 재개 시 이전 빌드 단계(npm ci → etl:2028 → build, path: dist)로 되돌린다.
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: offline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      # actions/deploy-pages 는 간헐적으로 실패하므로 최대 3회 재시도(첫 2회는 실패 허용).
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 15
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 20
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
